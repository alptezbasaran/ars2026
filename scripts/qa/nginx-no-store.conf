# nginx site config for the live deck servers: never let a browser cache a slide, figure,
# or animation page, so a plain reload always shows the current render (a stale tab still
# needs a reload; nothing refetches on hash navigation). Mounted at /etc/nginx/conf.d/default.conf.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-store, must-revalidate" always;
    sendfile off;   # the bind mount reports stale sizes right after a rewrite; sendfile then truncates the response
    expires off;
    location / { try_files $uri $uri/ =404; }
}
