name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable Pages for this repository, if it is not yet
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Cache Quarto
        uses: actions/cache@v4
        with:
          path: |
            .quarto-cache
            ~/.cache/quarto
          key: quarto-${{ hashFiles('_quarto.yml', 'slides/**/*.qmd', 'slides/theme/**') }}

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.40

      - name: Render slides
        run: quarto render slides/index.qmd --to revealjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: slides

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
