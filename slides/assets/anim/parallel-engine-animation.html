<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The parallel engine: a server keeps the books, workers run the transients, state moves worker to worker</title>
<style>
@import url("../fonts/open-sans.css");
body{background:#ffffff;display:grid;place-items:center;height:100vh;margin:0;overflow:hidden;font-family:'Open Sans',system-ui,sans-serif;color:#222;}
.wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;}
svg{width:min(96vw,170vh);height:auto;display:block;overflow:visible;}
button{position:fixed;bottom:14px;right:18px;background:#fff;color:#427E93;border:1px solid #427E93;padding:6px 18px;border-radius:4px;cursor:pointer;font-size:13px;letter-spacing:1px;font-family:inherit;}
button:hover{background:#427E93;color:#fff;}
</style>
</head>
<body>
<div class="wrap">
<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" font-family="Open Sans, system-ui, sans-serif">
  <rect x="-400" y="-50" width="2080" height="101.5" fill="#CC0000"/>
  <text x="20" y="35.5" font-size="34.5" fill="#ffffff">The parallel engine in action</text>
  <g id="server"></g>
  <g id="lanes"></g>
  <g id="tree"></g>
  <text id="caption" x="40" y="640" font-size="18" fill="#222"></text>
  <text id="closer" x="40" y="668" font-size="18.5" font-weight="600" fill="#B40000" opacity="0"></text>
</svg>
</div>
<button onclick="replay()">Replay</button>
<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
const INK = "#222", MUTED = "#737373", LINE = "#d9dde2", RED = "#B40000", GREEN = "#008473", DARK = "#990000";
const WC = ["#427E93", "#008473", "#D14905", "#6F7D1C", "#4156A1", "#8a5a00"];   // six workers, deck palette
const NW = WC.length;
function mk(tag, a, parent) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, String(a[k])); (parent || document.getElementById("stage")).appendChild(e); return e; }
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
const clamp01 = v => Math.max(0, Math.min(1, v));
const ease = v => { v = clamp01(v); return v < 0.5 ? 2 * v * v : 1 - Math.pow(-2 * v + 2, 2) / 2; };
// ---------------------------------------------------------------- the tree: eleven sequences, hand-placed
// A sequence starts at its branch point and runs to its end state; a branch point on a running sequence
// creates one new sequence (the first alternative stays with the running worker). Times are transient time.
const SEQS = [
  { id: 1, parent: 0, s: 0.0, e: 4.6 }, { id: 2, parent: 1, s: 0.9, e: 4.3 }, { id: 3, parent: 1, s: 1.7, e: 5.0 },
  { id: 4, parent: 2, s: 1.8, e: 3.7 }, { id: 5, parent: 3, s: 2.6, e: 4.5 }, { id: 6, parent: 1, s: 2.9, e: 4.2 },
  { id: 7, parent: 2, s: 3.1, e: 4.9 }, { id: 8, parent: 4, s: 2.5, e: 3.4 }, { id: 9, parent: 5, s: 3.5, e: 4.8 },
  { id: 10, parent: 7, s: 3.9, e: 4.7 }, { id: 11, parent: 6, s: 3.6, e: 4.4 },
];
const byId = {}; SEQS.forEach(q => byId[q.id] = q);
const HAND = 0.15;                                  // the hand-off: the state's trip from one worker to another
const SAVE = 0.3;                                   // saving the state and telling the server, before anyone can take it
// ---------------------------------------------------------------- the schedule: first come, first served, earliest-free worker
(function schedule() {
  const free = Array(NW).fill(0);
  const pending = [{ q: byId[1], avail: 0, donor: -1, wallBranch: 0 }];
  while (pending.length) {
    pending.sort((a, b) => a.avail - b.avail || a.q.id - b.q.id);
    const it = pending.shift(); let w = 0; for (let i = 1; i < NW; i++) if (free[i] < free[w]) w = i;
    const start = Math.max(free[w], it.avail), end = start + (it.q.e - it.q.s);
    Object.assign(it.q, { w, wallStart: start, wallEnd: end, avail: it.avail, wallBranch: it.wallBranch, donor: it.donor });
    free[w] = end;
    for (const c of SEQS.filter(c => c.parent === it.q.id)) { const wb = start + (c.s - it.q.s); pending.push({ q: c, avail: wb + SAVE + HAND, donor: w, wallBranch: wb }); }
  }
})();
const WALL_MAX = Math.max(...SEQS.map(q => q.wallEnd));
const SIM_MAX = Math.max(...SEQS.map(q => q.e));
const K = 4.0, T0 = 2.5;                             // seconds per wall unit; seconds before the first dispatch
const RUN_END = T0 + K * WALL_MAX, CLOSE0 = RUN_END + 2.2, T_END = CLOSE0 + 3.0;
const toS = u => T0 + u * K;
// the message log the server sees: numbers only
const EVENTS = [{ t: 0, text: "server → W1: run seq 1 from the initiating event" }];
for (const q of SEQS) {
  if (q.parent) { EVENTS.push({ t: q.wallBranch, text: `W${q.donor + 1} → server: branch point at ${q.s.toFixed(1)}, 2 alternatives` });
    EVENTS.push({ t: q.wallStart - HAND, text: `server → W${q.w + 1}: take seq ${q.id}, bytes from W${q.donor + 1}` }); }
  EVENTS.push({ t: q.wallEnd, text: `W${q.w + 1} → server: seq ${q.id} reached its end state` });
}
EVENTS.sort((a, b) => a.t - b.t);
// ---------------------------------------------------------------- captions
const firstBranch = Math.min(...SEQS.filter(q => q.parent).map(q => q.wallBranch));
const firstHand = Math.min(...SEQS.filter(q => q.parent).map(q => q.wallStart - HAND));
const queued = SEQS.filter(q => q.parent && q.wallStart - HAND > q.avail + 1e-9).sort((a, b) => a.wallBranch - b.wallBranch);

const CAPS = [
  [0, "Rank 0 is a bookkeeper: which worker runs what, which branches wait. It never holds a transient's state."],
  [toS(0), "A worker runs the single-CPU workflow, RELAP5 stepping and the crew deciding; the server hands it a sequence as a few numbers."],
  [toS(firstBranch), "At a branch point the worker saves its state (the archive), tells the server two numbers, and keeps going down the first alternative."],
  [toS(firstHand), "The server pairs the branch with a free worker. The 2.6 MB of state go worker to worker; the server never sees them."],
  [toS(firstWait), "Every worker busy: a new branch waits in the server's queue, held by the worker that made it, until someone finishes."],
  [toS(firstTake), "A worker that reaches an end state reports it and takes the next branch in line; its bytes come from the holder."],
  [RUN_END, "Queue empty, six idle: the tree is complete. Each worker's output renames into one tree, identical to the serial run's."],
];
const CLOSER = "Metadata through the server, state worker to worker: rank 0 at 25 MB whatever the tree, and the merged tree matches serial.";

const gS = document.getElementById("server"), SX = 40, SW = 290;
mk("text", { x: SX, y: 100, "font-size": 17, "font-weight": 600, fill: INK }, gS).textContent = "rank 0: the server";
mk("text", { x: SX, y: 119, "font-size": 12.5, fill: MUTED }, gS).textContent = "keeps the books, holds no transient state";
const rows = WC.map((c, i) => {

  const ring = mk("circle", { cx: SX + 8, cy: y - 4, r: 6.5, fill: "none", stroke: c, "stroke-width": 2 }, gS);
  const fill = mk("circle", { cx: SX + 8, cy: y - 4, r: 3.5, fill: c, opacity: 0 }, gS);
  mk("text", { x: SX + 21, y, "font-size": 12, "font-weight": 700, fill: c }, gS).textContent = "W" + (i + 1);
  const st = mk("text", { x: SX + 52, y, "font-size": 12, fill: MUTED }, gS);
  return { ring, fill, st };
});
mk("rect", { x: SX, y: 318, width: SW, height: 84, rx: 6, fill: "#f6f7f8", stroke: LINE }, gS);
mk("text", { x: SX + 10, y: 336, "font-size": 12, "font-weight": 700, fill: INK }, gS).textContent = "queue";
const qT = [0, 1, 2].map(j => mk("text", { x: SX + 10, y: 356 + j * 17, "font-size": 11.5, fill: INK }, gS));
mk("text", { x: SX, y: 428, "font-size": 10.5, "font-weight": 700, fill: MUTED, "letter-spacing": 1.2 }, gS).textContent = "LAST MESSAGE";
const msgT = mk("text", { x: SX, y: 446, "font-size": 11, fill: INK }, gS);
mk("text", { x: SX, y: 480, "font-size": 10.5, "font-weight": 700, fill: MUTED, "letter-spacing": 1.2 }, gS).textContent = "RANK 0 MEMORY";
mk("rect", { x: SX, y: 488, width: SW, height: 10, rx: 3, fill: "#eef0f2" }, gS);
mk("rect", { x: SX, y: 488, width: 30, height: 10, rx: 3, fill: "#555" }, gS);
mk("text", { x: SX + SW, y: 480, "font-size": 11.5, "font-weight": 700, fill: INK, "text-anchor": "end" }, gS).textContent = "25 MB, flat";
mk("text", { x: SX, y: 514, "font-size": 11, fill: MUTED }, gS).textContent = "metadata only: ids, times, branch counts";
const doneT = mk("text", { x: SX, y: 548, "font-size": 12.5, fill: INK }, gS);
const wallT = mk("text", { x: SX, y: 568, "font-size": 11.5, fill: MUTED }, gS);
// ---------------------------------------------------------------- the workers' lanes, in wall time
const gL = document.getElementById("lanes"), LX0 = 402, LX1 = 880, LY = i => 168 + i * 70;
const XW = u => LX0 + u * (LX1 - LX0) / WALL_MAX;
mk("text", { x: 360, y: 100, "font-size": 17, "font-weight": 600, fill: INK }, gL).textContent = "the workers";
mk("text", { x: 360, y: 119, "font-size": 12.5, fill: MUTED }, gL).textContent = "one transient each, drawn in wall time";
WC.forEach((c, i) => { mk("text", { x: 372, y: LY(i) + 4, "font-size": 12, "font-weight": 700, fill: c }, gL).textContent = "W" + (i + 1);
  mk("line", { x1: LX0, y1: LY(i), x2: LX1, y2: LY(i), stroke: LINE, "stroke-width": 1.2 }, gL); });
for (let u = 0; u <= Math.floor(WALL_MAX); u++) { mk("line", { x1: XW(u), y1: LY(5) + 14, x2: XW(u), y2: LY(5) + 20, stroke: "#c9ced6" }, gL);
  mk("text", { x: XW(u), y: LY(5) + 34, "font-size": 10.5, fill: MUTED, "text-anchor": "middle" }, gL).textContent = String(u); }
mk("text", { x: LX1, y: LY(5) + 52, "font-size": 11, fill: MUTED, "text-anchor": "end" }, gL).textContent = "wall time, in the transient's own units: a unit of transient costs a unit of wall";
const bar = {}, held = {}, arcs = {};
for (const q of SEQS) {
  const c = WC[q.w];
  const lab = mk("text", { x: XW(q.wallStart) + 2, y: LY(q.w) - 11, "font-size": 10, fill: MUTED, opacity: 0 }, gL); lab.textContent = "seq " + q.id;
  const rect = mk("rect", { x: XW(q.wallStart), y: LY(q.w) - 7, width: 0, height: 14, rx: 4, fill: c, opacity: 0.88 }, gL);
  const endSq = mk("rect", { x: XW(q.wallEnd) - 4, y: LY(q.w) - 5, width: 10, height: 10, fill: "#fff", stroke: c, "stroke-width": 2, opacity: 0 }, gL);
  bar[q.id] = { lab, rect, endSq };
}
for (const q of SEQS) if (q.parent) {
  const p = byId[q.parent], cd = WC[p.w], cr = WC[q.w];
  const x0 = XW(q.wallBranch), y0 = LY(p.w), x1 = XW(q.wallStart), y1 = LY(q.w);
  const dot = mk("circle", { cx: x0, cy: y0, r: 3.6, fill: "#333", opacity: 0 }, gL);
  const report = mk("line", { x1: x0, y1: y0, x2: SX + SW + 4, y2: y0, stroke: "#999", "stroke-width": 1, "stroke-dasharray": "2 3", opacity: 0 }, gL);
  const chip = mk("g", { opacity: 0 }, gL);                        // the saved state: a little archive
  for (let k = 0; k < 4; k++) mk("rect", { x: -6, y: -9 + k * 4.5, width: 12, height: 3.2, rx: 1, fill: k === 3 ? "#8a8a8a" : cd }, chip);
  const mb = mk("text", { x: 10, y: 3, "font-size": 10, "font-weight": 600, fill: cr, opacity: 0 }, chip); mb.textContent = "2.6 MB";
  const mid = { x: (x0 + x1) / 2, y: (y0 + y1) / 2 + (y1 > y0 ? -24 : 24) };
  const arc = mk("path", { d: `M${x0},${y0} Q${mid.x},${mid.y} ${x1},${y1}`, fill: "none", stroke: cr, "stroke-width": 1.4, "stroke-dasharray": "4 3", opacity: 0 }, gL);
  arcs[q.id] = { dot, report, chip, arc, mb, x0, y0, x1, y1, mid };
}
const head = mk("line", { x1: LX0, y1: LY(0) - 22, x2: LX0, y2: LY(5) + 14, stroke: RED, "stroke-width": 1, opacity: 0 }, gL);
// ---------------------------------------------------------------- the tree, in transient time: one row per sequence
const gT = document.getElementById("tree"), TX0 = 930, TX1 = 1222;
const XS = s => TX0 + s * (TX1 - TX0) / SIM_MAX;
mk("text", { x: 910, y: 100, "font-size": 17, "font-weight": 600, fill: INK }, gT).textContent = "the tree, in transient time";
const treeSub = mk("text", { x: 910, y: 119, "font-size": 12.5, fill: MUTED }, gT); treeSub.textContent = "one row per sequence, colored by the worker that ran it";
const order = []; (function dfs(id) { order.push(id); SEQS.filter(c => c.parent === id).sort((a, b) => a.s - b.s).forEach(c => dfs(c.id)); })(1);
const rowY = {}; order.forEach((id, j) => rowY[id] = 165 + j * 36);
mk("circle", { cx: XS(0), cy: rowY[1], r: 6, fill: DARK }, gT);
mk("text", { x: XS(0), y: rowY[1] - 12, "font-size": 10.5, fill: MUTED, "text-anchor": "middle" }, gT).textContent = "initiating event";
for (let s = 0; s <= SIM_MAX; s++) { mk("line", { x1: XS(s), y1: 150, x2: XS(s), y2: 545, stroke: "#eef0f2" }, gT); mk("text", { x: XS(s), y: 560, "font-size": 10.5, fill: MUTED, "text-anchor": "middle" }, gT).textContent = String(s); }
mk("text", { x: TX1, y: 578, "font-size": 11, fill: MUTED, "text-anchor": "end" }, gT).textContent = "transient time";
const trow = {};
for (const q of SEQS) {
  const c = WC[q.w], y = rowY[q.id];
  const link = q.parent ? mk("line", { x1: XS(q.s), y1: rowY[q.parent], x2: XS(q.s), y2: y, stroke: c, "stroke-width": 1.4, opacity: 0 }, gT) : null;
  const seg = mk("line", { x1: XS(q.s), y1: y, x2: XS(q.s), y2: y, stroke: c, "stroke-width": 3.2, "stroke-linecap": "round", opacity: 0 }, gT);
  const num = mk("text", { x: XS(q.s) - 7, y: y + 3.5, "font-size": 9.5, fill: MUTED, "text-anchor": "end", opacity: 0 }, gT); num.textContent = q.parent ? String(q.id) : "";
  const endSq = mk("rect", { x: XS(q.e) - 3.5, y: y - 3.5, width: 7, height: 7, fill: "#fff", stroke: c, "stroke-width": 1.8, opacity: 0 }, gT);
  trow[q.id] = { link, seg, num, endSq };
}
const checkT = mk("text", { x: 910, y: 604, "font-size": 12.5, "font-weight": 600, fill: GREEN, opacity: 0 }, gT);
// ---------------------------------------------------------------- render: a pure function of t
function render(t) {
  const u = Math.max(0, (t - T0) / K);                    // wall units elapsed since the first dispatch
  const running = t >= T0;
  let done = 0; const busy = Array(NW).fill(null); const waiting = [];
  for (const q of SEQS) {
    const prog = clamp01((u - q.wallStart) / (q.wallEnd - q.wallStart));
    const on = running && u >= q.wallStart;
    if (on && u < q.wallEnd) busy[q.w] = q;
    if (running && u >= q.wallEnd) done++;
    const b = bar[q.id];
    b.rect.setAttribute("width", on ? (XW(q.wallStart + prog * (q.wallEnd - q.wallStart)) - XW(q.wallStart)) : 0);
    b.lab.setAttribute("opacity", on ? 1 : 0); b.endSq.setAttribute("opacity", running && u >= q.wallEnd ? 1 : 0);
    const r = trow[q.id]; const sim = q.s + prog * (q.e - q.s);
    r.seg.setAttribute("x2", XS(on ? sim : q.s)); r.seg.setAttribute("opacity", on ? 1 : 0); r.num.setAttribute("opacity", on ? 1 : 0);
    if (r.link) r.link.setAttribute("opacity", on ? 1 : 0); r.endSq.setAttribute("opacity", running && u >= q.wallEnd ? 1 : 0);
    if (!q.parent) continue;
    const a = arcs[q.id], take = q.wallStart - HAND;
    const branched = running && u >= q.wallBranch;
    a.dot.setAttribute("opacity", branched ? 1 : 0);
    a.report.setAttribute("opacity", branched && u < q.wallBranch + 0.12 ? 0.9 : 0);
    if (branched && u < take) { if (u >= q.wallBranch + SAVE) waiting.push(q); a.chip.setAttribute("transform", `translate(${a.x0},${a.y0 - 20})`); a.chip.setAttribute("opacity", ease((u - q.wallBranch) / 0.12)); a.mb.setAttribute("opacity", 0); }
    else if (branched && u < q.wallStart) {                        // the hand-off: the state glides along the arc
      const f = ease((u - take) / HAND), x = (1 - f) * (1 - f) * a.x0 + 2 * (1 - f) * f * a.mid.x + f * f * a.x1, y = (1 - f) * (1 - f) * (a.y0 - 20) + 2 * (1 - f) * f * a.mid.y + f * f * a.y1;
      a.chip.setAttribute("transform", `translate(${x},${y})`); a.chip.setAttribute("opacity", 1); a.arc.setAttribute("opacity", 1); a.mb.setAttribute("opacity", 1);
    } else { a.chip.setAttribute("opacity", 0); const fade = branched ? clamp01(1 - (u - q.wallStart) / 0.35) : 0; a.arc.setAttribute("opacity", 0.9 * fade); }
  }
  rows.forEach((r, i) => { const q = busy[i]; r.fill.setAttribute("opacity", q ? 1 : 0); r.ring.setAttribute("stroke-width", q ? 2.6 : 1.4);
    r.st.textContent = q ? `running seq ${q.id}` : (running ? "idle" : "idle, waiting for work"); r.st.setAttribute("fill", q ? INK : MUTED); });
  waiting.sort((a, b) => a.wallBranch - b.wallBranch);
  qT.forEach((tt, j) => { const q = waiting[j]; tt.textContent = q ? `seq ${q.id}, held on W${q.donor + 1}` : (j === 0 ? "empty" : ""); tt.setAttribute("fill", q ? INK : MUTED); });
  let msg = ""; for (const e of EVENTS) if (running && u >= e.t) msg = e.text; msgT.textContent = msg || "(nothing yet)";
  doneT.textContent = `sequences finished: ${done} of ${SEQS.length}`;
  wallT.textContent = running ? `wall time: ${Math.min(u, WALL_MAX).toFixed(1)} units` : "";
  head.setAttribute("x1", XW(Math.min(u, WALL_MAX))); head.setAttribute("x2", XW(Math.min(u, WALL_MAX))); head.setAttribute("opacity", running && u < WALL_MAX ? 0.8 : 0);
  const finished = t >= RUN_END;
  treeSub.textContent = finished ? "renamed into one tree; identical to the serial run" : "one row per sequence, colored by the worker that ran it";
  treeSub.setAttribute("fill", finished ? GREEN : MUTED); treeSub.setAttribute("font-weight", finished ? 600 : 400);
  checkT.textContent = finished ? `${SEQS.length} sequences: the tree one core would build` : ""; checkT.setAttribute("opacity", finished ? ease((t - RUN_END) / 0.6) : 0);

  document.getElementById("caption").textContent = cap;

}
// ---------------------------------------------------------------- driver: play once, freeze, Replay
let t = 0, playing = true, last = null;
function frame(ts) { if (last == null) last = ts; const dt = Math.min(0.05, (ts - last) / 1000); last = ts;

requestAnimationFrame(frame);
function replay() { t = 0; playing = true; last = null; }
window.__anim = { T: T_END, seek(x) { playing = false; t = Math.max(0, Math.min(T_END, x)); render(t); } };
const qs = new URLSearchParams(location.search); if (qs.get("t")) { t = parseFloat(qs.get("t")) || 0; }
</script>

<script>
// deck bridge: inside the reveal deck, let the presenter move the deck from within
// this animation. PageDown/PageUp (clickers), N/P and Esc go to reveal's postMessage
// API; this page has no arrow-key controls of its own, so arrows forward immediately.
// Outside the deck this is inert.
(() => {
  if (window.parent === window) return;
  const send = m => window.parent.postMessage(JSON.stringify({ method: m, args: [] }), "*");
  window.__deck = { next: () => send("next"), prev: () => send("prev") };
  addEventListener("keydown", e => {
    if (e.code === "PageDown" || e.code === "ArrowRight" || (e.key === "n" && !e.metaKey && !e.ctrlKey)) { e.preventDefault(); e.stopImmediatePropagation(); send("next"); }
    else if (e.code === "PageUp" || e.code === "ArrowLeft" || (e.key === "p" && !e.metaKey && !e.ctrlKey)) { e.preventDefault(); e.stopImmediatePropagation(); send("prev"); }
    else if (e.code === "Escape") { send("toggleOverview"); }
  }, true);
})();
</script>

<script>
// deck fit: inside the reveal deck, lay this page out as a fixed 1280x720 slide and
// scale it like reveal scales its slides.
(() => {
  if (window.parent === window) return;
  const D = { w: 1280, h: 720 };
  const w = document.querySelector(".wrap");
  if (!w) return;
  document.documentElement.style.overflow = "hidden";
  document.body.style.overflow = "hidden";
  Object.assign(w.style, { width: D.w + "px", maxWidth: "none", height: D.h + "px",
    margin: "0", position: "absolute", left: "50%", top: "50%",
    padding: "10px 0 0", boxSizing: "border-box", justifyContent: "flex-start" });
  const stage = document.getElementById("stage");
  if (stage) { stage.style.width = "1280px"; stage.style.height = "680px"; stage.style.margin = "0 auto"; }
  // On a stage taller than 16:9 (the deck's fit-to-screen, on a laptop) everything under the
  // title band moves down by half of the extra height, as the deck's own slides do. The band,
  // the svg's first two children, stays where it is.
  function lower(dy) { if (!stage) return; const on = dy > 0.5; stage.style.transform = on ? `translateY(${dy}px)` : "";
    for (const el of Array.from(stage.children).slice(0, 2)) { if (on) el.setAttribute("transform", `translate(0,${-dy})`); else el.removeAttribute("transform"); } }
  // place the box exactly where the deck places its slide box (read from the parent page;
  // same origin), so bands and text line up at any window shape; fall back to centering
  function fit() { let r = null; try { const el = window.parent.document.querySelector(".reveal .slides"); if (el) r = el.getBoundingClientRect(); } catch (e) {}
    if (r && r.width > 100) { const k = r.width / D.w; Object.assign(w.style, { left: "0", top: "0", transformOrigin: "0 0", transform: `translate(${r.left}px,${r.top}px) scale(${k})` }); lower(Math.max(0, r.height / k - D.h) / 2); return; }
    const s = Math.min(innerWidth / D.w, innerHeight / D.h) * 0.96;
    Object.assign(w.style, { left: "50%", top: "50%", transformOrigin: "50% 50%", transform: `translate(-50%,-50%) scale(${s})` }); }
  addEventListener("resize", fit); fit();
})();
</script>

<script>
// band balance (2026-11-17): inside the deck the tab strip covers the top of this page's red
// band, by an amount that depends on the window. The deck publishes the strip's lower edge as
// --band-top (stage px below the slide's top) and places its own titles from it; the same
// shift is applied here to the band and its title. 5.46 is the distance both were drawn for.
(() => {
  if (window.parent === window) return;
  const band = document.querySelector("svg#stage > rect"), title = document.querySelector("svg#stage > text");
  if (!band || !title) return;
  const H0 = parseFloat(band.getAttribute("height")), Y0 = parseFloat(title.getAttribute("y"));
  function apply() {
    let d = 0;
    try {
      const v = parseFloat(window.parent.document.documentElement.style.getPropertyValue("--band-top"));
      if (!isNaN(v)) d = v - 5.46;
    } catch (e) {}
    band.setAttribute("height", (H0 + d).toFixed(2));
    title.setAttribute("y", (Y0 + d).toFixed(2));
  }
  addEventListener("resize", apply);
  addEventListener("load", apply);
  apply();
})();
</script>
</body>
