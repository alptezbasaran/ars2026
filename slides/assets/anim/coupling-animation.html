    if (k < 0.3) lx = lerp(EX + EW + 2, PILL_X, ease(k / 0.3));
    else if (k < 0.5) rf = ease((k - 0.3) / 0.2);
    else if (k < 0.65) rf = 1;
    else if (k < 0.85) rf = 1 - ease((k - 0.65) / 0.2);
    else lx = lerp(PILL_X, EX + EW + 2, ease((k - 0.85) / 0.15));
  }
  pulseL.setAttribute("opacity", lx != null ? 1 : 0); if (lx != null) { pulseL.setAttribute("cx", lx); pulseL.setAttribute("cy", y); }
  pulseR.forEach((p, j) => { const on = c && k >= 0.3 && k < 0.85; p.setAttribute("opacity", on ? 1 : 0); if (on) { p.setAttribute("cx", lerp(PILL_X + PILL_W, 900, rf)); p.setAttribute("cy", lerp(y, CARD_Y[j], rf)); } });
  plants.forEach(p => p.busy.setAttribute("opacity", c && k >= 0.5 && k < 0.65 ? 1 : 0));
  // the wire text: request, then response
  if (c) { payT.textContent = (k < 0.55 ? "→ " + c.req : "← " + c.res); payT.setAttribute("fill", k < 0.55 ? INK : (c.trip && k >= 0.55 ? RED : GREEN)); payT.setAttribute("opacity", 1); }
  else payT.setAttribute("opacity", 0);
  callT.textContent = c ? ("calling: " + VERBS[c.v].label) : (t >= RUN_END ? "sequence complete" : "");
  // the plants: session badges, gauges, trip lamps, tokens
  const p = signalAt(t), f = clamp01((p - P_MIN) / (P_MAX - P_MIN));
  const sessionOn = t >= T_SESSION && t < T_DELETE, tripOn = t >= T_TRIP && t < T_RESTORE, tokenOn = t >= T_TOKEN;
  const si = Math.floor(t / SIM_DWELL) % SIMS.length, sp = t % SIM_DWELL, so = clamp01(Math.min(sp, SIM_DWELL - sp) / 0.35);
  plants.forEach(pl => { pl.simName.textContent = SIMS[si][0]; pl.simName.setAttribute("fill-opacity", so); pl.simDesc.textContent = SIMS[si][1]; pl.simDesc.setAttribute("opacity", so); });
  plants.forEach(pl => { pl.badge.setAttribute("opacity", sessionOn ? 1 : 0); pl.fill.setAttribute("width", sessionOn ? 200 * f : 0); pl.val.textContent = sessionOn ? "+" + Math.round(p) + " K" : "";
    pl.led.setAttribute("fill", tripOn ? RED : "none"); pl.led.setAttribute("stroke", tripOn ? RED : LINE); pl.ledT.setAttribute("fill", tripOn ? RED : MUTED); pl.ledT.setAttribute("font-weight", tripOn ? 700 : 400);
    pl.tok.setAttribute("opacity", tokenOn ? 1 : 0); pl.none.setAttribute("opacity", tokenOn ? 0 : 1); });
  tokenChip.setAttribute("opacity", tokenOn ? 1 : 0); tokenNone.setAttribute("opacity", tokenOn ? 0 : 1);
  tokenT.textContent = tokenOn ? "one token per branch point:" : ""; tokenT2.textContent = tokenOn ? "id or image, never opened" : "";
  // the trajectory on the left
  const sA = kf(SIM_A, t), sB = t >= T_RESTORE ? kf(SIM_B, t) : 2.5;
  const ptsA = []; for (let s = 0; s <= sA + 1e-9; s += 0.05) ptsA.push(`${XT(s).toFixed(1)},${YP(kf(P_A, s)).toFixed(1)}`);
  trajA.setAttribute("points", t >= 5.5 ? ptsA.join(" ") : "");
  const ptsB = []; if (t >= T_RESTORE) for (let s = 2.5; s <= sB + 1e-9; s += 0.05) ptsB.push(`${XT(s).toFixed(1)},${YP(kf(P_B, s)).toFixed(1)}`);
  trajB.setAttribute("points", ptsB.join(" "));
  forkDot.setAttribute("opacity", t >= T_TRIP ? 1 : 0); forkT.setAttribute("opacity", t >= T_TRIP ? 1 : 0);
  const hs = t >= T_RESTORE ? sB : sA; headDot.setAttribute("cx", XT(hs)); headDot.setAttribute("cy", YP(t >= T_RESTORE ? kf(P_B, hs) : kf(P_A, hs))); headDot.setAttribute("fill", t >= T_RESTORE ? OLIVE : BLUE); headDot.setAttribute("opacity", t >= 5.5 && t < RUN_END ? 1 : 0);
  // the end: the two services that speak the same six verbs today light up
  const finished = t >= SWAP0, ks = clamp01((t - SWAP0) / 1.2);
  slots.forEach((s, j) => { s.g.setAttribute("opacity", 0.38 + 0.62 * ease(ks)); s.badge.setAttribute("opacity", t >= SWAP0 + 1.2 ? 1 : 0); });
  linksS.forEach((l, j) => { l.setAttribute("y1", 336); l.setAttribute("opacity", finished ? 0.9 : 0); });
  pulseS.forEach((p, j) => { const on = finished && ks < 1; p.setAttribute("opacity", on ? 1 : 0); if (on) { p.setAttribute("cx", lerp(PILL_X + PILL_W, 900, ease(ks))); p.setAttribute("cy", lerp(336, SLOT_Y[j], ease(ks))); } });
  plantSub.textContent = finished ? "the same six verbs, whatever the physics" : "one simulator runs the story; two services wait below";
  plantSub.setAttribute("fill", finished ? GREEN : MUTED); plantSub.setAttribute("font-weight", finished ? 600 : 400);
  let cap = CAPS[0][1]; for (const [tt, s] of CAPS) if (t >= tt) cap = s;
  document.getElementById("caption").textContent = cap;
  const closer = document.getElementById("closer"); closer.textContent = CLOSER; closer.setAttribute("opacity", t >= CLOSE0 ? ease((t - CLOSE0) / 0.6) : 0);
}
// ---------------------------------------------------------------- driver: play once, freeze, Replay
let t = 0, playing = true, last = null;
function frame(ts) { if (last == null) last = ts; const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
  if (playing) { t += dt; if (t >= T_END) { t = T_END; playing = false; } }
  render(t); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
function replay() { t = 0; playing = true; last = null; }
window.__anim = { T: T_END, seek(x) { playing = false; t = Math.max(0, Math.min(T_END, x)); render(t); } };
const qs = new URLSearchParams(location.search); if (qs.get("t")) { t = parseFloat(qs.get("t")) || 0; }
</script>

<script>
// deck bridge: inside the reveal deck, let the presenter move the deck from within
// this animation. PageDown/PageUp (clickers), N/P and Esc go to reveal's postMessage
// API; this page has no arrow-key controls of its own, so arrows forward immediately.
// Outside the deck this is inert.
(() => {
  if (window.parent === window) return;
  const send = m => window.parent.postMessage(JSON.stringify({ method: m, args: [] }), "*");
  window.__deck = { next: () => send("next"), prev: () => send("prev") };
  addEventListener("keydown", e => {
    if (e.code === "PageDown" || e.code === "ArrowRight" || (e.key === "n" && !e.metaKey && !e.ctrlKey)) { e.preventDefault(); e.stopImmediatePropagation(); send("next"); }
    else if (e.code === "PageUp" || e.code === "ArrowLeft" || (e.key === "p" && !e.metaKey && !e.ctrlKey)) { e.preventDefault(); e.stopImmediatePropagation(); send("prev"); }
    else if (e.code === "Escape") { send("toggleOverview"); }
  }, true);
})();
</script>

<script>
// deck fit: inside the reveal deck, lay this page out as a fixed 1280x720 slide and
// scale it like reveal scales its slides.
(() => {
  if (window.parent === window) return;
  const D = { w: 1280, h: 720 };
  const w = document.querySelector(".wrap");
  if (!w) return;
  document.documentElement.style.overflow = "hidden";
  document.body.style.overflow = "hidden";
  Object.assign(w.style, { width: D.w + "px", maxWidth: "none", height: D.h + "px",
    margin: "0", position: "absolute", left: "50%", top: "50%",
    padding: "10px 0 0", boxSizing: "border-box", justifyContent: "flex-start" });
  const stage = document.getElementById("stage");
  if (stage) { stage.style.width = "1280px"; stage.style.height = "680px"; stage.style.margin = "0 auto"; }
  // On a stage taller than 16:9 (the deck's fit-to-screen, on a laptop) everything under the
  // title band moves down by half of the extra height, as the deck's own slides do. The band,
  // the svg's first two children, stays where it is.
  function lower(dy) { if (!stage) return; const on = dy > 0.5; stage.style.transform = on ? `translateY(${dy}px)` : "";
    for (const el of Array.from(stage.children).slice(0, 2)) { if (on) el.setAttribute("transform", `translate(0,${-dy})`); else el.removeAttribute("transform"); } }
  // place the box exactly where the deck places its slide box (read from the parent page;
  // same origin), so bands and text line up at any window shape; fall back to centering
  function fit() { let r = null; try { const el = window.parent.document.querySelector(".reveal .slides"); if (el) r = el.getBoundingClientRect(); } catch (e) {}
    if (r && r.width > 100) { const k = r.width / D.w; Object.assign(w.style, { left: "0", top: "0", transformOrigin: "0 0", transform: `translate(${r.left}px,${r.top}px) scale(${k})` }); lower(Math.max(0, r.height / k - D.h) / 2); return; }
    const s = Math.min(innerWidth / D.w, innerHeight / D.h) * 0.96;
    Object.assign(w.style, { left: "50%", top: "50%", transformOrigin: "50% 50%", transform: `translate(-50%,-50%) scale(${s})` }); }
  addEventListener("resize", fit); fit();
})();
</script>

<script>
// band balance (2026-11-17): inside the deck the tab strip covers the top of this page's red
// band, by an amount that depends on the window. The deck publishes the strip's lower edge as
// --band-top (stage px below the slide's top) and places its own titles from it; the same
// shift is applied here to the band and its title. 5.46 is the distance both were drawn for.
(() => {
  if (window.parent === window) return;
  const band = document.querySelector("svg#stage > rect"), title = document.querySelector("svg#stage > text");
  if (!band || !title) return;
  const H0 = parseFloat(band.getAttribute("height")), Y0 = parseFloat(title.getAttribute("y"));
  function apply() {
    let d = 0;
    try {
      const v = parseFloat(window.parent.document.documentElement.style.getPropertyValue("--band-top"));
      if (!isNaN(v)) d = v - 5.46;
    } catch (e) {}
    band.setAttribute("height", (H0 + d).toFixed(2));
    title.setAttribute("y", (Y0 + d).toFixed(2));
  }
  addEventListener("resize", apply);
  addEventListener("load", apply);
  apply();
})();
</script>
